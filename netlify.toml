# Trappist Legend — NÉBULA · déploiement Netlify (site statique, auto-deploy à chaque push)
[build]
  publish = "."

# Proxy API -> backend trappist.land (Render) : même origine côté navigateur, pas de CORS.
# Le jeu appelle /api/tc/<chemin> -> https://trappistai-backend.onrender.com/api/<chemin>
[[redirects]]
  from = "/api/tc/*"
  to = "https://trappistai-backend.onrender.com/api/:splat"
  status = 200
  force = true

# la racine ouvre le menu de choix des niveaux
[[redirects]]
  from = "/"
  to = "/index.html"
  status = 302

# accès direct aux niveaux
[[redirects]]
  from = "/nebula"
  to = "/nebula.html"
  status = 302

[[redirects]]
  from = "/trappistland"
  to = "/trappistland.html"
  status = 302
